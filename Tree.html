<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Tree Visualization</title>
    <style>
        :root {
            --bg-color: #f0f4f0;
            --tree-line: #1b5e20;
            --card-bg: #ffffff;
            --card-border: #2e7d32;
            --text-main: #1b5e20;
            --text-sub: #4caf50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { color: var(--text-main); margin: 0; font-size: 18px; }

        button {
            background-color: var(--tree-line);
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 13px;
        }

        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            padding: 0;
        }

        #viewport {
            flex-grow: 1;
            overflow: hidden; 
            cursor: grab;
            position: relative;
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 20px 20px; 
        }

        #viewport:active { cursor: grabbing; }

        .tree-layer {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0; 
            transition: transform 0.1s linear; 
        }

        .tree {
            display: flex;
            justify-content: center;
            padding: 50px; 
            width: max-content; 
        }

        .tree ul {
            padding-top: 20px;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .tree li {
            float: left;
            text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 5px 0 5px;
        }

        .tree li::before, .tree li::after {
            content: '';
            position: absolute;
            top: 0;
            right: 50%;
            border-top: 2px solid var(--tree-line);
            width: 50%;
            height: 20px;
        }

        .tree li::after {
            right: auto;
            left: 50%;
            border-left: 2px solid var(--tree-line);
        }

        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid var(--tree-line); border-radius: 0 5px 0 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree ul ul::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            border-left: 2px solid var(--tree-line);
            width: 0;
            height: 20px;
        }

        .member-container {
            display: inline-flex;
            gap: 10px;
            background: rgba(255,255,255,0.5);
            padding: 10px;
            border-radius: 10px;
            border: 1px dashed var(--tree-line);
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            width: 170px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            position: relative;
            text-align: left;
        }

        .card-img-container { text-align: center; }
        .card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--tree-line);
            margin-bottom: 5px;
            background: #eee;
        }

        .card h3 { margin: 5px 0; font-size: 13px; color: var(--text-main); text-align: center;}
        .card .title { font-size: 11px; font-weight: bold; color: var(--text-sub); text-align: center; margin-bottom: 5px;}
        .card .details { font-size: 10px; color: #555; line-height: 1.4; border-top: 1px solid #ddd; padding-top: 5px; }
        
        .status-badge { font-weight: bold; display: inline-block; padding: 2px 5px; border-radius: 3px; font-size: 9px; margin-bottom: 3px;}
        .status-dead { background-color: #ffebee; color: #c62828; }
        .status-alive { background-color: #e8f5e9; color: #2e7d32; }
        
        .row-detail { display: flex; margin-bottom: 2px; }
        .row-detail span:first-child { width: 50px; font-weight: bold; }

        #loading { padding: 20px; text-align: center; font-weight: bold; }

    </style>
</head>
<body>

    <header>
        <h1 id="mainTitle">Family Tree</h1>
        <button onclick="resetTree()">Reset Top</button>
    </header>
    
    <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <button class="zoom-btn" onclick="zoomOut()">-</button>
        <button class="zoom-btn" onclick="fitToScreen()" title="Fit All">⛶</button>
    </div>

    <div id="viewport">
        <div id="treeLayer" class="tree-layer">
            <div id="loading">Loading Data...</div>
            <div class="tree" id="treeContainer"></div>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL DEPLOYED WEB APP URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbyCCHhhLiRzPOXf8c0Dx0UcRms2aqzW_l846RhFVLJy2C_sIVEyOAKbpsI1biINoH0g/exec'; 

        let rawData = [];
        let totalPersonsDisplayed = 0;
        
        let scale = 1;
        let panning = false;
        let pointX = 0, pointY = 0, startX = 0, startY = 0;

        const viewport = document.getElementById('viewport');
        const treeLayer = document.getElementById('treeLayer');

        async function init() {
            try {
                const response = await fetch(API_URL);
                rawData = await response.json();
                document.getElementById('loading').style.display = 'none';
                
                if(rawData.length > 0) {
                   renderTree(rawData[0]["Nama Sendiri"]);
                   setTimeout(fitToScreen, 500); 
                } else {
                    document.getElementById('loading').textContent = "No data found in Sheet.";
                    document.getElementById('loading').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('loading').textContent = "Error: " + error.message;
            }
        }

        function renderTree(focusName) {
            totalPersonsDisplayed = 0; 
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';
            
            const treeHtml = buildHierarchyHTML(focusName);
            const ul = document.createElement('ul');
            ul.innerHTML = treeHtml;
            container.appendChild(ul);

            document.getElementById('mainTitle').textContent = `Family tree of "${focusName}" - Total: ${totalPersonsDisplayed} persons`;
        }

        function buildHierarchyHTML(personName) {
            const person = rawData.find(p => p["Nama Sendiri"] === personName);
            if (!person) return '';
            
            totalPersonsDisplayed++;
            
            const children = rawData.filter(p => p["Nama Ayah / Ibu"] === person["Nama Sendiri"]);

            let html = `<li>
                <div class="member-container">
                    ${createCard(person)}
                    ${getSpouseCard(person)}
                </div>`;

            if (children.length > 0) {
                html += '<ul>';
                children.forEach(child => html += buildHierarchyHTML(child["Nama Sendiri"]));
                html += '</ul>';
            }
            html += '</li>';
            return html;
        }

        function getSpouseCard(person) {
            const spouseName = person["Nama Pasangan"];
            if(!spouseName) return '';
            const spouseData = rawData.find(p => p["Nama Sendiri"] === spouseName);
            
            if (spouseData) {
                totalPersonsDisplayed++;
                return createCard(spouseData, true);
            }
            
            totalPersonsDisplayed++;
            return `<div class="card">
                    <div class="card-img-container">
                        <img src="https://via.placeholder.com/80?text=No+Img" alt="Spouse">
                    </div>
                    <h3>${spouseName}</h3>
                    <div class="title">Pasangan</div>
                </div>`;
        }

        function createCard(data, isSpouse = false) {
            const statusVal = data["Status Hidup"] || data["Status hidupan"] || '';
            const isDead = statusVal.toLowerCase().includes('meninggal');
            const statusClass = isDead ? 'status-dead' : 'status-alive';
            const imgUrl = data["URL Gambar"] && data["URL Gambar"].startsWith('http') ? data["URL Gambar"] : 'https://via.placeholder.com/80?text=No+Img';
            const clickAction = isSpouse ? '' : `onclick="reCenterTree('${data["Nama Sendiri"]}')"`;

            const formatDate = (dateStr) => {
                if(!dateStr) return '-';
                const d = new Date(dateStr);
                return isNaN(d) ? dateStr : d.toLocaleDateString();
            };

            let extraFields = '';
            if (isDead) {
                extraFields = `
                    <div class="row-detail"><span>Wafat:</span> <span>${formatDate(data["Tarikh Kematian"])}</span></div>
                    <div class="row-detail"><span>Kubur:</span> <span>${data["Lokasi Kubur"] || '-'}</span></div>
                `;
            }

            return `
                <div class="card" ${clickAction}>
                    <div class="card-img-container">
                        <img src="${imgUrl}" alt="Photo">
                    </div>
                    <h3>${data["Nama Sendiri"] || '-'}</h3>
                    <div class="title">${data["Gelaran"] || ''}</div>
                    <div class="details">
                        <div style="text-align: center;"><span class="status-badge ${statusClass}">${statusVal || 'Tidak Diketahui'}</span></div>
                        <div class="row-detail"><span>Lahir:</span> <span>${formatDate(data["Tarikh Lahir"])}</span></div>
                        <div class="row-detail"><span>Tel:</span> <span>${data["No Phone"] || '-'}</span></div>
                        <div class="row-detail"><span>Rumah:</span> <span>${data["Lokasi Rumah"] || '-'}</span></div>
                        ${extraFields}
                    </div>
                </div>
            `;
        }

        function resetTree() {
            if(rawData.length > 0) {
                reCenterTree(rawData[0]["Nama Sendiri"]);
            }
        }

        function reCenterTree(name) {
            renderTree(name);
            setTimeout(fitToScreen, 100);
        }

        // --- PAN AND ZOOM LOGIC ---
        function setTransform() { treeLayer.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }
        function zoomIn() { scale *= 1.2; setTransform(); }
        function zoomOut() { scale /= 1.2; setTransform(); }

        function fitToScreen() {
            const treeContent = document.getElementById('treeContainer');
            const contentWidth = treeContent.offsetWidth;
            const contentHeight = treeContent.offsetHeight;
            const viewWidth = viewport.offsetWidth;
            const viewHeight = viewport.offsetHeight;

            if(contentWidth === 0) return; // Not rendered yet

            const scaleX = (viewWidth - 40) / contentWidth;
            const scaleY = (viewHeight - 100) / contentHeight;
            scale = Math.min(scaleX, scaleY, 1); 

            pointX = (viewWidth - contentWidth * scale) / 2;
            pointY = 20; 

            setTransform();
        }

        viewport.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
            panning = true;
        });

        viewport.addEventListener('mousemove', (e) => {
            if (!panning) return;
            e.preventDefault();
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            setTransform();
        });

        viewport.addEventListener('mouseup', () => { panning = false; });
        viewport.addEventListener('mouseleave', () => { panning = false; });

        viewport.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
                panning = true;
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            if(e.touches.length === 1 && panning) {
                pointX = e.touches[0].clientX - startX;
                pointY = e.touches[0].clientY - startY;
                setTransform();
            }
        });
        viewport.addEventListener('touchend', () => { panning = false; });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const xs = (e.clientX - pointX) / scale;
            const ys = (e.clientY - pointY) / scale;
            const delta = -e.deltaY;
            
            (delta > 0) ? (scale *= 1.1) : (scale /= 1.1);
            
            pointX = e.clientX - xs * scale;
            pointY = e.clientY - ys * scale;
            setTransform();
        }, { passive: false });

        init();
    </script>
</body>
</html>
