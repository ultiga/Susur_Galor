<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Tree Visualization</title>
    <style>
        :root {
            /* Dark Green and White Theme */
            --bg-color: #f4f8f4;
            --tree-line: #004d00;
            --card-bg: #ffffff;
            --card-border: #004d00;
            --text-main: #003300;
            --text-sub: #2e7d32;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--tree-line);
        }

        h1 {
            color: var(--text-main);
            margin: 0;
            font-size: 20px;
        }

        button {
            background-color: var(--tree-line);
            color: white;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            padding: 0;
        }

        #viewport {
            flex-grow: 1;
            overflow: hidden;
            cursor: grab;
            position: relative;
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 20px 20px;
        }

        #viewport:active { cursor: grabbing; }

        .tree-layer {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            transition: transform 0.1s linear;
        }

        .tree {
            display: flex;
            justify-content: center;
            padding: 50px;
            width: max-content;
        }

        .tree ul {
            padding-top: 20px;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .tree li {
            float: left;
            text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 5px 0 5px;
        }

        .tree li::before, .tree li::after {
            content: '';
            position: absolute;
            top: 0;
            right: 50%;
            border-top: 2px solid var(--tree-line);
            width: 50%;
            height: 20px;
        }

        .tree li::after {
            right: auto;
            left: 50%;
            border-left: 2px solid var(--tree-line);
        }

        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid var(--tree-line); border-radius: 0 5px 0 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree ul ul::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            border-left: 2px solid var(--tree-line);
            width: 0;
            height: 20px;
        }

        .member-container {
            display: inline-flex;
            gap: 15px;
            background: rgba(255,255,255,0.7);
            padding: 10px;
            border-radius: 10px;
            border: 2px dashed var(--tree-line);
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            width: 180px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            text-align: left;
        }

        .card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--tree-line);
            margin: 0 auto 10px auto;
            display: block;
            background: #eee;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card img:hover { transform: scale(1.1); }
        .card h3 { margin: 5px 0; font-size: 15px; color: var(--text-main); text-align: center; }
        .card .title { font-size: 12px; font-weight: bold; color: var(--text-sub); text-align: center; margin-bottom: 8px;}
        .card .details { font-size: 11px; color: #333; line-height: 1.5; }
        .card .status-dead { color: #d32f2f; font-weight: bold; }
        .card .status-alive { color: var(--tree-line); font-weight: bold; }
        .card a { color: #1976d2; text-decoration: none; }
        .card a:hover { text-decoration: underline; }

        #loading { padding: 20px; text-align: center; font-weight: bold; font-size: 18px; color: var(--tree-line);}

    </style>
</head>
<body>

    <header>
        <h1 id="mainTitle">Family Tree</h1>
        <button onclick="resetTree()">Reset Top</button>
    </header>
    
    <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <button class="zoom-btn" onclick="zoomOut()">-</button>
        <button class="zoom-btn" onclick="fitToScreen()" title="Fit All">⛶</button>
    </div>

    <div id="viewport">
        <div id="treeLayer" class="tree-layer">
            <div id="loading">Loading Data...</div>
            <div class="tree" id="treeContainer"></div>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbzm7WH7JriMMxmFJtmHnEeHX-oL_tvBjqei6Vker_Of-yXI4koggiMz8Os_vdfktttv/exec'; 

        let rawData = [];
        let totalPersons = 0;
        
        let scale = 1;
        let panning = false;
        let pointX = 0, pointY = 0, startX = 0, startY = 0;

        const viewport = document.getElementById('viewport');
        const treeLayer = document.getElementById('treeLayer');

        async function init() {
            try {
                const response = await fetch(API_URL);
                rawData = await response.json();
                document.getElementById('loading').style.display = 'none';
                
                if(rawData.length > 0) {
                   renderTree(rawData[0]["Nama Sendiri"]);
                   setTimeout(fitToScreen, 500); 
                }
            } catch (error) {
                document.getElementById('loading').textContent = "Error: " + error.message;
            }
        }

        function renderTree(focusName) {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';
            totalPersons = 0; 
            
            const treeHtml = buildHierarchyHTML(focusName);
            const ul = document.createElement('ul');
            ul.innerHTML = treeHtml;
            container.appendChild(ul);

            document.getElementById('mainTitle').textContent = `Family tree of "${focusName}" - Total Persons: ${totalPersons}`;
        }

        function buildHierarchyHTML(personName) {
            const person = rawData.find(p => p["Nama Sendiri"] === personName);
            if (!person) return '';
            const children = rawData.filter(p => p["Nama Ayah / Ibu"] === person["Nama Sendiri"]);

            let html = `<li>
                <div class="member-container">
                    ${createCard(person)}
                    ${getSpouseCard(person)}
                </div>`;

            if (children.length > 0) {
                html += '<ul>';
                children.forEach(child => html += buildHierarchyHTML(child["Nama Sendiri"]));
                html += '</ul>';
            }
            html += '</li>';
            return html;
        }

        function getSpouseCard(person) {
            const spouseName = person["Nama Pasangan"];
            if(!spouseName) return '';
            const spouseData = rawData.find(p => p["Nama Sendiri"] === spouseName);
            
            if (spouseData) return createCard(spouseData, true);
            
            // Render basic card if spouse data not explicitly in main rows
            totalPersons++;
            return `<div class="card">
                    <img src="https://via.placeholder.com/80?text=No+Img" alt="Spouse" onclick="reCenterTree('${spouseName}')">
                    <h3>${spouseName}</h3>
                    <div class="title">Pasangan kepada ${person["Nama Sendiri"]}</div>
                </div>`;
        }

        function createCard(data, isSpouse = false) {
            totalPersons++;
            const isDead = (data["Status hidupan"] || '').toLowerCase().includes('meninggal');
            const statusClass = isDead ? 'status-dead' : 'status-alive';
            const imgUrl = data["URL Gambar"] && data["URL Gambar"].startsWith('http') ? data["URL Gambar"] : 'https://via.placeholder.com/80?text=No+Img';
            
            let additionalFields = '';
            if (data["Lokasi Rumah"]) {
                additionalFields += `📍 <a href="${data["Lokasi Rumah"]}" target="_blank">Lokasi Rumah</a><br>`;
            }
            if (isDead) {
                additionalFields += `💀 <b>Kematian:</b> ${data["Tarikh Kematian"] ? new Date(data["Tarikh Kematian"]).toLocaleDateString() : '-'}<br>`;
                if (data["Lokasi Kubur"]) {
                    additionalFields += `🪦 <a href="${data["Lokasi Kubur"]}" target="_blank">Lokasi Kubur</a><br>`;
                }
            }

            return `
                <div class="card">
                    <img src="${imgUrl}" alt="Photo" onclick="reCenterTree('${data["Nama Sendiri"]}')" title="Click to make root">
                    <h3>${data["Nama Sendiri"]}</h3>
                    <div class="title">${data["Gelaran"] || ''}</div>
                    <div class="details">
                        <b>Status:</b> <span class="${statusClass}">${data["Status hidupan"] || 'Tidak Diketahui'}</span><br>
                        <b>Phone:</b> ${data["No Phone"] || '-'}<br>
                        <b>Lahir:</b> ${data["Tarikh Lahir"] ? new Date(data["Tarikh Lahir"]).toLocaleDateString() : '-'}<br>
                        ${additionalFields}
                    </div>
                </div>
            `;
        }

        function resetTree() {
            if(rawData.length > 0) {
                reCenterTree(rawData[0]["Nama Sendiri"]);
            }
        }

        function reCenterTree(name) {
            renderTree(name);
            setTimeout(fitToScreen, 100);
        }

        function setTransform() { treeLayer.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }
        function zoomIn() { scale *= 1.2; setTransform(); }
        function zoomOut() { scale /= 1.2; setTransform(); }

        function fitToScreen() {
            const treeContent = document.getElementById('treeContainer');
            const contentWidth = treeContent.offsetWidth;
            const contentHeight = treeContent.offsetHeight;
            const viewWidth = viewport.offsetWidth;
            const viewHeight = viewport.offsetHeight;

            const scaleX = (viewWidth - 40) / contentWidth;
            const scaleY = (viewHeight - 100) / contentHeight;
            scale = Math.min(scaleX, scaleY, 1); 

            pointX = (viewWidth - contentWidth * scale) / 2;
            pointY = 20; 
            setTransform();
        }

        // Event Listeners for Panning and Zooming
        viewport.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
            panning = true;
        });

        viewport.addEventListener('mousemove', (e) => {
            if (!panning) return;
            e.preventDefault();
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            setTransform();
        });

        viewport.addEventListener('mouseup', () => { panning = false; });
        viewport.addEventListener('mouseleave', () => { panning = false; });

        viewport.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
                panning = true;
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            if(e.touches.length === 1 && panning) {
                pointX = e.touches[0].clientX - startX;
                pointY = e.touches[0].clientY - startY;
                setTransform();
            }
        });

        viewport.addEventListener('touchend', () => { panning = false; });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const xs = (e.clientX - pointX) / scale;
            const ys = (e.clientY - pointY) / scale;
            const delta = -e.deltaY;
            (delta > 0) ? (scale *= 1.1) : (scale /= 1.1);
            pointX = e.clientX - xs * scale;
            pointY = e.clientY - ys * scale;
            setTransform();
        }, { passive: false });

        init();
    </script>
</body>
</html>
