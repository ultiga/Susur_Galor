<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Dashboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Prevents outer scrollbars */
        }

        /* Container arranged vertically */
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Header Navigation */
        .topbar {
            background-color: #2c3e50;
            color: white;
            padding: 12px 24px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        .topbar h3 {
            margin: 0;
            font-size: 1.1rem;
            padding-right: 10px;
            border-right: 1px solid #4a627a;
        }

        /* Nav links grouped horizontally */
        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            padding: 8px 16px;
            background-color: #34495e;
            border-radius: 5px;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
        }

        .nav-links a:hover {
            background-color: #1abc9c;
        }

        /* Bottom Content Area */
        .main-content {
            flex: 1; /* Fills remaining vertical space */
            background-color: #ecf0f1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navbar -->
        <header class="topbar">
            <h3>Menu</h3>
            <nav class="nav-links">
                <a href="Tree.html" target="view_window">View Family Tree</a>
                <a href="Form.html" target="view_window">Open Input Form</a>
            </nav>
        </header>

        <!-- Bottom Content Window -->
        <main class="main-content">
            <iframe name="view_window" src="Tree.html"></iframe>
        </main>
    </div>

</body>
</html>
